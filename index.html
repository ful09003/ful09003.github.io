<html>
<head>
    <style>
        .container{
            margin: 2rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
        }
        .header {
            font-family: sans-serif;
            font-size: 4em;
            font-weight: bolder;
            grid-column: 1 / span 4;
            grid-row: 1;
            justify-self: center;
            text-align: center;
        }
        .item {
            justify-self: center;
            padding:0.5rem;
            grid-row: 2;
        }
	.item-big {
	    justify-self: center;
            padding:0.5rem;
            grid-row: 4;
	}
        .helpitem {
            text-align: center;
            padding:0.2rem;
            grid-row: 3;
            grid-column: auto;
            font-size: 0.75rem;
            color:darkslategrey;
        }
        #outtext {
            margin-top: 1em;
            font-family: Arial sans-serif;
            color: dimgrey;
            grid-column: 1 / span 4;
            grid-row: 4;
        }
        textarea {
            border: 1px solid #888;
            overflow: auto;
        }
    </style>
    </script>
</head>
<body>
<div class="container">
    <div class="header">Hello</div>
    <div class="item-big">
      <p>
	This is a <a href="https://docs.github.com/en/pages/quickstart">Github Pages</a> site for myself (Michael Fuller).
      </p>
      <p>
	I would have forgotten it (Git history suggests I set it up 8 years ago???), except I recently was applying for a job and was asked for my personal site URL, and the field was required. So, here we are.
      </p>
    </div>
    <div class="item">
      <a href="/ooble.html">ooble</a>
    </div>
</div>
</body>
</html>
